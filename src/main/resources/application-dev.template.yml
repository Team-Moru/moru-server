spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://{HOST}:{PORT}/{DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: {USERNAME}
    password: {PASSWORD}
  data:
    redis:
      url: redis://localhost:6379
  jpa:
    hibernate:
      ddl-auto: {DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: {JWT_SECRET_32_BYTES_OR_LONGER}
  access-token-expiration: 1h
  refresh-token-expiration: 14d

oauth:
  google:
    client-id: {GOOGLE_CLIENT_ID}
    issuer: https://accounts.google.com
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
  apple:
    issuer: https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys
    client-id: {APPLE_CLIENT_ID}
    team-id: {APPLE_TEAM_ID}
    key-id: {APPLE_KEY_ID}
    private-key: {APPLE_PRIVATE_KEY}
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke

security:
  apple-token:
    encryption-key: {APPLE_TOKEN_ENCRYPTION_KEY}
