spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://{HOST}:{PORT}/{DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: {USERNAME}
    password: {PASSWORD}
  jpa:
    hibernate:
      ddl-auto: {DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: {JWT_SECRET_32_BYTES_OR_LONGER}
  access-token-expiration: 1h
  refresh-token-expiration: 14d

oauth:
  google:
    client-id: {GOOGLE_CLIENT_ID}
  apple:
    issuer: https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys
    audience: {APPLE_AUDIENCE}
