spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: moru-server
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}

dev-auth:
  secret: ${DEV_AUTH_SECRET:}

security:
  apple-token:
    encryption-key: ${APPLE_TOKEN_ENCRYPTION_KEY:}
  apple-withdrawal:
    allow-missing-credential: ${APPLE_WITHDRAWAL_ALLOW_MISSING_CREDENTIAL:false}

member:
  withdrawal-lock:
    ttl: ${MEMBER_WITHDRAWAL_LOCK_TTL:60s}
    renew-interval: ${MEMBER_WITHDRAWAL_LOCK_RENEW_INTERVAL:20s}
    renewal-pool-size: ${MEMBER_WITHDRAWAL_LOCK_RENEWAL_POOL_SIZE:4}

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}
