spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: moru-server
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${SERVER_PORT:8080}

dev-auth:
  secret: ${DEV_AUTH_SECRET:}
